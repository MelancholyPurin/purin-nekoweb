<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <base href="../">
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.4/build/98.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/photofeed.css">
    <link rel="stylesheet" href="assets/DialogueSystem.js%20Template%20-%20OMORI/styles.css">
    <style>
        body { margin: 0; background: transparent; }

        /* Scope the OMORI textbox to our lightbox — override game-scene positioning */
        #lightbox .textbox-wrap {
            width: 100%;
            height: auto;
            --base-width: 92;
        }
        #lightbox .textbox {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <section class="photofeed-page">
        <div class="fake-screen photofeed-intro">
            <p>Stuff that's made me laugh or I find amusing.</p>
        </div>
        <div class="polaroid-grid" id="polaroid-grid"></div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox-overlay" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <div class="lightbox-top">
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
            <p class="lightbox-date" id="lightbox-date"></p>
        </div>
        <!-- OMORI dialogue box at the bottom of the overlay -->
        <div class="textbox-wrap">
            <div data-enabled="false" id="textbox" class="textbox"></div>
        </div>
    </div>

    <!-- Classic script — must load before the module so globals are available -->
    <script src="assets/DialogueSystem.js%20Template%20-%20OMORI/DialogueSystem.js"></script>

    <script type="module">
        import { photoList } from './assets/js/data/photofeed-data.js';

        const OMORI_BASE = 'assets/DialogueSystem.js Template - OMORI/';

        // --- DOM refs ---
        const grid         = document.getElementById('polaroid-grid');
        const lightbox     = document.getElementById('lightbox');
        const lightboxImg  = document.getElementById('lightbox-img');
        const lightboxDate = document.getElementById('lightbox-date');
        const textbox      = document.getElementById('textbox');

        // --- Lightbox state ---
        let isLightboxOpen = false;

        // Placeholders — overwritten below if DialogueSystem loaded successfully
        let diaManager    = null;
        let DiaSetActive  = async () => {};

        // ---------------------------------------------------------------
        // Render polaroids first — this always runs regardless of whether
        // the dialogue system loaded.
        // ---------------------------------------------------------------
        const rotations = [-3, 1.5, -2, 2.5, -1, 3, 0.5, -2.5, 1.2, -1.8, 2.2, -0.5];

        photoList.forEach(function(photo, i) {
            const rot = rotations[i % rotations.length];

            const card = document.createElement('div');
            card.className = 'polaroid';
            card.style.setProperty('--rot', rot + 'deg');

            const inner = document.createElement('div');
            inner.className = 'polaroid-inner';

            const img = document.createElement('img');
            img.className = 'polaroid-photo';
            img.src = photo.src;
            img.alt = photo.title;
            img.loading = 'lazy';

            const titleEl = document.createElement('span');
            titleEl.className = 'polaroid-title';
            titleEl.textContent = photo.title;

            inner.appendChild(img);
            inner.appendChild(titleEl);
            card.appendChild(inner);

            card.addEventListener('click', async function() {
                if (isLightboxOpen) return;
                isLightboxOpen = true;

                lightboxImg.src = photo.src;
                lightboxImg.alt = photo.title;
                lightboxDate.textContent = photo.date || '';
                lightbox.classList.add('active');

                if (photo.caption && diaManager) {
                    await DiaSetActive(true);
                    // Don't await — let text type in the background;
                    // cursor appears automatically when typing finishes.
                    diaManager.Type(photo.caption, 1, new DialogueData({ audio: 'default' }));
                }
            });

            grid.appendChild(card);
        });

        // ---------------------------------------------------------------
        // Close handlers
        // ---------------------------------------------------------------
        async function closeLightbox() {
            if (!isLightboxOpen) return;
            lightbox.classList.remove('active');
            if (diaManager) {
                diaManager.Finish();
                while (diaManager.isInUse) {
                    await new Promise(r => setTimeout(r, 16));
                }
                if (diaManager.isActive) await DiaSetActive(false);
            }
            isLightboxOpen = false;
        }

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        // ---------------------------------------------------------------
        // OMORI DialogueManager setup — runs after polaroids are rendered.
        // Wrapped in try/catch so a load failure degrades gracefully
        // (lightbox still works, just without the dialogue box).
        // ---------------------------------------------------------------
        try {
            // Class declarations in classic scripts don't become window properties —
            // access them as bare names through the shared global scope instead.
            if (typeof DialogueManager === 'undefined') throw new Error('DialogueSystem.js did not load');

            const dm = new DialogueManager(textbox);

            const cursorImg = document.createElement('img');
            cursorImg.src = OMORI_BASE + 'img/cursor_menu.png';
            cursorImg.style.opacity = 0;
            cursorImg.classList.add('cursor');
            textbox.append(cursorImg);

            dm.config.audios.items.push(
                new DialogueAudioClip('default', OMORI_BASE + 'audio/[SE]-TEXT.ogg')
            );

            dm.animation.box.onEnable  = new DialogueAnimation({ animation: 'linear box',         duration: 0.2 });
            dm.animation.box.onDisable = new DialogueAnimation({ animation: 'reverse linear box', duration: 0.2 });

            class OmoriAudioSource extends DialogueAudioSource {
                get pitch() { return super.pitch * (Math.random() * 0.2 + 0.9); }
            }
            dm.audioSource = new OmoriAudioSource();
            dm.audioSource.volume = 0.5;

            let cursorEnabling = false;
            let endCursorEnable = false;

            dm.On(DialogueEvent.TypingEnter, () => {
                if (cursorEnabling) endCursorEnable = true;
                cursorImg.style.opacity = 0;
                cursorImg.style.transition = '';
                cursorImg.style.animation = '';
            });
            dm.On(DialogueEvent.TypingExit, () => {
                cursorEnabling = true;
                cursorImg.style.opacity = 1;
                cursorImg.style.transition = 'opacity 0.25s';
                let time = 0;
                DialogueLoop.Append(() => {
                    if (endCursorEnable) { endCursorEnable = false; cursorEnabling = false; return; }
                    if (time < 0.25) { time += DialogueLoop.deltaTime; return; }
                    cursorImg.style.transition = '';
                    cursorImg.style.animation = 'alternate cursor 0.5s linear infinite';
                    cursorEnabling = false;
                }, null, () => !cursorEnabling);
            });

            DiaSetActive = async function(state) {
                if (state) {
                    await dm.SetActive(true);
                    return;
                }
                if (cursorEnabling) endCursorEnable = true;
                cursorImg.style.opacity = 0;
                cursorImg.style.transition = '';
                cursorImg.style.animation = '';
                await dm.SetActive(false);
                await DialogueLoop.Delay(DialogueLoop.deltaTime);
            };

            diaManager = dm;

        } catch(e) {
            console.warn('OMORI dialogue system unavailable — lightbox will show without it.', e);
        }
    </script>
</body>
</html>
